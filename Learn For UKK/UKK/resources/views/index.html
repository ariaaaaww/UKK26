<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Praktek JWD - Feb 2022</title>
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <form action="" class="booking-form">
        <h1 class="titleForm">Form Pemesanan</h1>

        <div class="full-name">
            <label for="name">Nama Lengkap</label>
            <input type="text" id="name" name="name">
        </div>
        <div class="identity-number">
            <label for="identity-number">Nomor Identitas</label>
            <input type="number" id="identity-number" name="identity-number">
        </div>
        <div class="phone-number">
            <label for="phone-number">No. Hp</label>
            <input type="number" id="phone-number" name="phone-number">
        </div>
        <div class="date">
            <label for="date">Jadwal Keberangkatan</label>
            <input type="date" id="date" name="date">
        </div>

    </form>

    <script src="../js/app.js"></script>
</body>

</html>
